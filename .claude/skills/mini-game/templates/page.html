<!doctype html>
<!-- TEMPLATE for <game>.html: replace "My Game", "mygame" and the words, keep the structure. The kit's
     (peak/kit/kit.css, peak/kit/README.md) and the title's (peak/ui/title.css) ids and classes are what the
     modules look for. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Game</title>
<meta name="description" content="One sentence: Mnot, the premise, the mountain.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="peak/scores/scores.css">
<link rel="stylesheet" href="peak/ui/title.css">
<link rel="stylesheet" href="peak/ui/preload.css">
<link rel="preload" href="models/mnot.glb" as="fetch" crossorigin>
<link rel="stylesheet" href="peak/kit/kit.css">
<link rel="stylesheet" href="peak/kit/pad.css">
<style>
  /* The HUD is the kit's (peak/kit/kit.css); the game's own parts go here, and its logo's style. */
  .mg-tag { margin: 0.1em 0 0; padding: 2px 12px; border-style: dashed; border-radius: 9px; font-size: 15px;
    font-weight: 600; transform: rotate(-2deg); }
  .mg-tag b { color: var(--red); }
  @media (max-width: 560px) { .mg-tag { font-size: 13px; } }
</style>
</head>
<body class="preloading">
<div id="preload" role="status" aria-label="Loading">
  <div class="pl-can"><i></i><i></i></div>
  <div class="pl-shadow"></div>
  <div class="pl-name">My Game</div>
  <div class="pl-bar card"><i></i></div>
</div>
<div id="hud">
  <div id="title" class="card"><b>My Game</b>
    <div id="stats"><span id="time">0:00.0</span></div>
  </div>
  <button id="sound" class="card" aria-pressed="true">Sound</button>
  <div id="scores-hud"></div>
  <div id="toast"><b></b><small class="card"></small></div>
  <div id="help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>R</kbd> again</div>
  <div id="title-screen" hidden>
    <div class="ts-top">
      <h1 class="ts-logo">My Game</h1>
      <div class="mg-tag card">The premise, in a few words. <b>The twist.</b></div>
    </div>
    <div class="ts-howto card" id="title-howto" hidden>
      <h2>How to play</h2>
      <dl>
        <dt><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> or arrows</dt><dd>walk</dd>
        <dt><kbd>R</kbd></dt><dd>start again</dd>
        <dt>touch</dt><dd>what a thumb does</dd>
      </dl>
      <p>The goal in two sentences, in the premise's words.</p>
    </div>
    <div class="ts-bottom">
      <div class="ts-menu">
        <button type="button" class="card ts-start" id="title-start">Start</button>
        <!-- the Hall of Fame opens here once the game has a board (peak/scores/scores.js createBoard) -->
        <button type="button" class="card" id="hall-of-fame">Hall of Fame</button>
        <button type="button" class="card" id="title-help" aria-expanded="false" aria-controls="title-howto">How to play</button>
        <button type="button" class="card" id="title-sound" aria-pressed="true">Sound on</button>
      </div>
      <p class="ts-press"><span class="key">Press any key to start</span><span class="tap">Tap anywhere to start</span></p>
      <p class="ts-tip card" id="title-tip" aria-live="polite"></p>
    </div>
  </div>
  <div id="finish" class="card panel" hidden>
    <h1>Done!</h1>
    <div class="time">0:00.0</div>
    <div class="verdict"></div>
    <div><kbd class="key-only">R</kbd><i class="pg pg-y pad-only"></i> again</div>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module" src="peak/mygame/main.js"></script>
<script>
// The local development server disables caching and watches code, models and sound assets.
if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname) && !location.search.includes('manual')) {
  let version;
  async function checkUpdates() {
    try {
      const response = await fetch('/__dev_version', { cache: 'no-store' });
      if (!response.ok) return;
      const update = await response.json();
      if (version !== undefined && update.version !== version) location.reload();
      version = update.version;
    } catch { /* The game stays playable while the development server restarts. */ }
  }
  checkUpdates();
  setInterval(checkUpdates, 750);
}
</script>
</body>
</html>
